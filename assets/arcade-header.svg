<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Player 1: Abdullah. Select class: Builder plus Strategist. Insert coin.">
<style>
.t{font-family:"Courier New",Consolas,Menlo,"DejaVu Sans Mono",monospace;font-weight:700}
.cover,.cursor{animation:type 7s steps(34,end) infinite}
.cursor{animation:type 7s steps(34,end) infinite,blink .9s steps(1) infinite}
.coin{animation:blink 1.2s steps(1) infinite}
.tw{animation:twinkle 2.4s steps(1) infinite}
@keyframes type{0%{transform:translateX(0)}55%,100%{transform:translateX(440px)}}
@keyframes blink{50%{opacity:0}}
@keyframes twinkle{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.cover{display:none}.cursor,.coin,.tw{animation:none}}
</style>
