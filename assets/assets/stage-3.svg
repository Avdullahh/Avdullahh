<path d="M166 138L183 148L166 158z" fill="#3ad6ff" shape-rendering="geometricPrecision"/><text x="515" y="155" font-size="21" fill="#3ad6ff" text-anchor="middle" textLength="640" lengthAdjust="spacingAndGlyphs">PLAYER 2 READY? SELECT A CHANNEL TO JOIN THE GAME</text></g>
